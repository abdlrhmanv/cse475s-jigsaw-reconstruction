# Weak extra matcher (real val_ap ~0.26). Prefer Siamese for ML matching.
# Train first: python main.py train-gnn --real --max-boards 40

method: gnn
infer_grid: true
rows: 7
cols: 5
filter:
  median_k: 3
  gaussian_k: 5
  gaussian_sigma: 1.0
thresholder: otsu
segmentation:
  fill_holes: true
  min_area: 2000
  min_area_frac: 0.001
  max_aspect: 5.0
  min_solidity: 0.35
  min_rel_area: 0.40
  max_area_frac: 0.25
  close_k: 3
  keep_n: null            # runtime: unique YOLO class count when labels exist
  use_gt_boxes: false
matching:
  weights: checkpoints/gnn.pt
  top_k: 8  # match training graph sparsity (top_k=8)
assembly:
  beam_k: 8
