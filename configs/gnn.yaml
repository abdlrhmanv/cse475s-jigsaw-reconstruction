# GNN matching: same extraction/assembly as classical.
# Train first: python main.py train-gnn --epochs 40

method: gnn
rows: 7
cols: 5
filter:
  median_k: 3
  gaussian_k: 5
  gaussian_sigma: 1.0
thresholder: otsu
segmentation:
  fill_holes: true
  min_area: 2000
  min_area_frac: 0.001
  max_aspect: 5.0
  min_solidity: 0.35
  close_k: 3
  keep_n: 35
  use_gt_boxes: true
matching:
  weights: checkpoints/gnn.pt
  top_k: 8
assembly:
  beam_k: 8
